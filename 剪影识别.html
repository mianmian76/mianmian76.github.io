<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刀剑乱舞剪影识别</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f2f3f5; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; }
  body.dragging { background: #e8f5ec; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
  @media (max-width: 600px) { .wrap { padding: 12px; } h1 { font-size: 17px; } header { flex-direction: column; gap: 4px; } }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  .status { font-size: 13px; color: #6b7280; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.06); }
  .drop { border: 2px dashed #c8ccd4; border-radius: 10px; padding: 40px; text-align: center; color: #6b7280; cursor: pointer; }
  .drop:hover { border-color: #16a34a; color: #16a34a; }
  .stage { position: relative; display: inline-block; line-height: 0; }
  #shot { display: block; border-radius: 6px; }
  #box { position: absolute; border: 2px solid #16a34a; box-shadow: 0 0 0 1px rgba(255,255,255,.9); display: none; cursor: move; }
  .cell { position: absolute; }
  .cell.on { background: rgba(22,163,74,.22); }
  .bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  button { font-size: 14px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }
  #go { background: #16a34a; color: #fff; }
  #go:disabled { background: #c9d6cd; cursor: default; }
  #pick { background: #f0f1f3; color: #374151; }
  .tips { font-size: 12px; color: #98a0ac; margin-top: 8px; line-height: 1.6; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f1f3; }
  .row.first .name { color: #16a34a; font-weight: 600; }
  .rank { width: 22px; color: #9aa1ad; font-size: 14px; }
  .thumb { width: 64px; height: 64px; object-fit: contain; border: 1px solid #eceef1; border-radius: 6px; background: #fff; }
  .name { font-size: 15px; }
  .sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .hint { font-size: 12px; color: #98a0ac; margin-top: 10px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>刀剑乱舞剪影识别</h1>
    <span class="status" id="status">把截图拖进来，或点下面的按钮选择</span>
  </header>

  <div class="card">
    <div class="drop" id="drop">
      拖入游戏截图，或点击选择文件<br>
      <span style="font-size:12px">截图里要包含完整的 3×3 巧克力棋盘</span>
    </div>
    <div style="display:none" id="stage">
      <div class="stage" id="stageInner">
        <img id="shot">
        <div id="box">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
    </div>
    <div class="bar">
      <button id="pick">选择截图</button>
      <button id="go" disabled>开始识别</button>
      <input type="file" id="file" accept="image/*">
    </div>
    <div class="tips">
      拖动绿框可微调位置，Ctrl+滚轮缩放大小，方向键微移，Shift+方向键更细；也可以直接把截图粘贴进来（Ctrl+V）。
    </div>
  </div>

  <div class="card">
    <div id="results"><div class="hint">识别结果会显示在这里。</div></div>
  </div>
</div>

<script>
// utils/board.js
// 从整张截图里定位 3x3 巧克力棋盘，并判断哪几格已经揭开。

const GRID = 3;

// 7x7 窗口内的局部方差，用于把“平整的底色”和“有明暗过渡的巧克力”区分开
function buildStats(data, w, h) {
  const lum = new Uint8Array(w * h);
  const sat = new Uint8Array(w * h);
  const S = new Float64Array((w + 1) * (h + 1));
  const S2 = new Float64Array((w + 1) * (h + 1));

  for (let y = 0; y < h; y++) {
    let rowS = 0;
    let rowS2 = 0;
    const base = y * (w + 1);
    const prev = (y - 1) * (w + 1);
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const L = (r * 299 + g * 587 + b * 114) / 1000;
      lum[y * w + x] = L;
      const mx = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
      sat[y * w + x] = mx - mn > 45 ? 1 : 0;
      rowS += L;
      rowS2 += L * L;
      S[base + x + 1] = (y > 0 ? S[prev + x + 1] : 0) + rowS;
      S2[base + x + 1] = (y > 0 ? S2[prev + x + 1] : 0) + rowS2;
    }
  }
  return { lum, sat, S, S2, w, h };
}

function rectSum(I, w, x0, y0, x1, y1) {
  const A = y0 * (w + 1) + x0;
  const B = y0 * (w + 1) + x1 + 1;
  const C = (y1 + 1) * (w + 1) + x0;
  const D = (y1 + 1) * (w + 1) + x1 + 1;
  return I[D] - I[B] - I[C] + I[A];
}

// 平整且带颜色的像素构成每格底色，按连通域提取
function flatRegions(st, radius, varThr) {
  const { sat, lum, S, S2, w, h } = st;
  const r = radius;
  const mask = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - r);
    const y1 = Math.min(h - 1, y + r);
    for (let x = 0; x < w; x++) {
      if (!sat[y * w + x]) continue;
      const x0 = Math.max(0, x - r);
      const x1 = Math.min(w - 1, x + r);
      const cnt = (x1 - x0 + 1) * (y1 - y0 + 1);
      const s = rectSum(S, w, x0, y0, x1, y1);
      const s2 = rectSum(S2, w, x0, y0, x1, y1);
      const mean = s / cnt;
      if (s2 / cnt - mean * mean < varThr) mask[y * w + x] = 1;
    }
  }
  return mask;
}

function components(mask, w, h, minArea, maxArea) {
  const label = new Int32Array(w * h).fill(-1);
  const out = [];
  const stack = new Int32Array(w * h);
  for (let start = 0; start < w * h; start++) {
    if (!mask[start] || label[start] !== -1) continue;
    const id = out.length;
    let sp = 0;
    stack[sp++] = start;
    label[start] = id;
    let area = 0;
    let sumX = 0;
    let sumY = 0;
    let minX = w;
    let maxX = 0;
    let minY = h;
    let maxY = 0;
    while (sp > 0) {
      const p = stack[--sp];
      const px = p % w;
      const py = (p - px) / w;
      area++;
      sumX += px;
      sumY += py;
      if (px < minX) minX = px;
      if (px > maxX) maxX = px;
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
      for (let dy = -1; dy <= 1; dy++) {
        const ny = py + dy;
        if (ny < 0 || ny >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const nx = px + dx;
          if (nx < 0 || nx >= w) continue;
          const q = ny * w + nx;
          if (mask[q] && label[q] === -1) {
            label[q] = id;
            stack[sp++] = q;
          }
        }
      }
    }
    if (area < minArea || area > maxArea) continue;
    const bw = maxX - minX + 1;
    const bh = maxY - minY + 1;
    if (bw < 8 || bh < 8) continue;
    const aspect = bw / bh;
    if (aspect < 0.55 || aspect > 1.8) continue;
    if (area / (bw * bh) < 0.3) continue;
    out.push({ area, cx: sumX / area, cy: sumY / area, bw, bh });
  }
  return out;
}

// 在点集里找等间距的三列／三行
function triple(values) {
  const v = values.slice().sort((a, b) => a - b);
  const uniq = [];
  for (let i = 0; i < v.length; i++) {
    if (!uniq.length || v[i] - uniq[uniq.length - 1] > 25) uniq.push(v[i]);
  }
  let best = null;
  for (let i = 0; i < uniq.length - 2; i++) {
    for (let j = i + 1; j < uniq.length - 1; j++) {
      for (let k = j + 1; k < uniq.length; k++) {
        const d1 = uniq[j] - uniq[i];
        const d2 = uniq[k] - uniq[j];
        if (d1 < 20 || d2 < 20) continue;
        const err = Math.abs(d1 - d2) / Math.max(d1, d2);
        if (err > 0.3) continue;
        if (!best || err < best.err) {
          best = { lo: uniq[i], mid: uniq[j], hi: uniq[k], err, step: (d2 + d1) / 2 };
        }
      }
    }
  }
  return best;
}

// 以内容区边界为界，避开面板外侧多余的白边
function refineByContent(st, box) {
  const { lum, w, h } = st;
  const x0 = Math.max(0, Math.floor(box.x - box.size * 0.15));
  const x1 = Math.min(w - 1, Math.ceil(box.x + box.size * 1.15));
  const y0 = Math.max(0, Math.floor(box.y - box.size * 0.15));
  const y1 = Math.min(h - 1, Math.ceil(box.y + box.size * 1.15));
  const cx = Math.round(box.x + box.size / 2);
  const cy = Math.round(box.y + box.size / 2);
  if (cx < x0 || cx > x1 || cy < y0 || cy > y1) return box;

  const rowWhite = new Float64Array(h);
  const colWhite = new Float64Array(w);
  for (let y = y0; y <= y1; y++) {
    let c = 0;
    for (let x = x0; x <= x1; x++) if (lum[y * w + x] > 228) c++;
    rowWhite[y] = c / (x1 - x0 + 1);
  }
  for (let x = x0; x <= x1; x++) {
    let c = 0;
    for (let y = y0; y <= y1; y++) if (lum[y * w + x] > 228) c++;
    colWhite[x] = c / (y1 - y0 + 1);
  }

  const span = (arr, center, lo, hi) => {
    if (arr[center] >= 0.6) return null;
    let a = center;
    let b = center;
    while (a > lo && arr[a - 1] < 0.6) a--;
    while (b < hi && arr[b + 1] < 0.6) b++;
    return [a, b];
  };

  const yy = span(rowWhite, cy, y0, y1);
  const xx = span(colWhite, cx, x0, x1);
  if (!yy || !xx) return box;
  const size = Math.min(xx[1] - xx[0] + 1, yy[1] - yy[0] + 1);
  return { x: xx[0], y: yy[0], size };
}

/**
 * 预处理：生成亮度／饱和度统计与积分图，后续定位和格子判定都复用。
 */
function prepare(data, w, h) {
  return buildStats(data, w, h);
}

/**
 * 定位九宫格。
 * @returns {{x:number,y:number,size:number,confidence:number,cells:number[]}}
 */
function detect(st, opts) {
  const { w, h } = st;
  const o = opts || {};
  const radius = o.radius || Math.max(2, Math.round(Math.min(w, h) / 200));
  const varThr = o.varThr || 400;
  const mask = flatRegions(st, radius, varThr);
  const minArea = w * h * 0.002;
  const maxArea = w * h * 0.06;
  const comps = components(mask, w, h, minArea, maxArea);

  const lat = comps.length >= 5 ? bestLattice(comps) : null;

  if (!lat) {
    // 没找到时的默认框：按这款游戏的界面比例落位（棋盘在画面右侧偏上）
    const s0 = Math.min(Math.round(h * 0.476), Math.round(w * 0.476));
    const x = Math.min(Math.max(0, Math.round(w * 0.675 - s0 / 2)), w - s0);
    const y = Math.min(Math.max(0, Math.round(h * 0.564 - s0 / 2)), h - s0);
    const fallback = { x, y, size: s0 };
    return { ...fallback, confidence: 0, cells: classify(st, fallback) };
  }

  // 白框精修只在离粗框不远时才采信，否则说明这一帧的白色边界不是棋盘边框
  let out = lat.box;
  const refined = refineByContent(st, lat.box);
  const tol = lat.box.size * 0.35;
  if (
    Math.abs(refined.size - lat.box.size) < tol &&
    Math.abs(refined.x - lat.box.x) < tol &&
    Math.abs(refined.y - lat.box.y) < tol
  ) {
    out = refined;
  }
  return {
    x: Math.round(out.x),
    y: Math.round(out.y),
    size: Math.round(out.size),
    confidence: 1,
    cells: classify(st, out),
  };
}

// 把一组坐标按间距聚成若干档，返回所有等间距三元组
function triplesOf(values) {
  const v = values.slice().sort((a, b) => a - b);
  const uniq = [];
  for (let i = 0; i < v.length; i++) {
    if (!uniq.length || v[i] - uniq[uniq.length - 1] > 25) uniq.push(v[i]);
  }
  const out = [];
  for (let i = 0; i < uniq.length - 2; i++) {
    for (let j = i + 1; j < uniq.length - 1; j++) {
      const d1 = uniq[j] - uniq[i];
      if (d1 < 30) continue;
      for (let k = j + 1; k < uniq.length; k++) {
        const d2 = uniq[k] - uniq[j];
        if (d2 < 30) continue;
        const err = Math.abs(d1 - d2) / Math.max(d1, d2);
        if (err > 0.3) continue;
        out.push({ lo: uniq[i], hi: uniq[k], step: (d1 + d2) / 2, err });
      }
    }
  }
  return out;
}

// 在色块质心里找最像 3x3 棋盘的那一组：命中越多越好、越方正越好
function bestLattice(comps) {
  const xs = triplesOf(comps.map((c) => c.cx));
  const ys = triplesOf(comps.map((c) => c.cy));
  let best = null;
  for (let a = 0; a < xs.length; a++) {
    const tx = xs[a];
    for (let b = 0; b < ys.length; b++) {
      const ty = ys[b];
      const square = Math.abs(tx.step - ty.step) / Math.max(tx.step, ty.step);
      if (square > 0.25) continue;
      const size = ((tx.step + ty.step) / 2) * GRID;
      const cell = size / GRID;
      const x0 = tx.lo - tx.step / 2;
      const y0 = ty.lo - ty.step / 2;
      if (x0 < -cell * 0.5 || y0 < -cell * 0.5) continue;

      let hits = 0;
      for (let i = 0; i < comps.length; i++) {
        const c = comps[i];
        const gx = Math.round((c.cx - x0) / cell - 0.5);
        const gy = Math.round((c.cy - y0) / cell - 0.5);
        if (gx < 0 || gx > 2 || gy < 0 || gy > 2) continue;
        const cx = x0 + (gx + 0.5) * cell;
        const cy = y0 + (gy + 0.5) * cell;
        if (Math.abs(c.cx - cx) < cell * 0.35 && Math.abs(c.cy - cy) < cell * 0.35) hits++;
      }
      if (hits < 4) continue;
      const score = hits * 2 - square * 4 - tx.err - ty.err;
      if (!best || score > best.score) {
        best = { score, hits, box: { x: x0, y: y0, size } };
      }
    }
  }
  return best;
}

// 每格内彩色像素占比低于阈值，视为已揭开
function classify(st, box) {
  const { sat, w, h } = st;
  const step = box.size / GRID;
  const cells = [];
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const px0 = Math.round(box.x + c * step + step * 0.1);
      const px1 = Math.round(box.x + (c + 1) * step - step * 0.1);
      const py0 = Math.round(box.y + r * step + step * 0.1);
      const py1 = Math.round(box.y + (r + 1) * step - step * 0.1);
      let colored = 0;
      let total = 0;
      for (let y = Math.max(0, py0); y < Math.min(h, py1); y++) {
        for (let x = Math.max(0, px0); x < Math.min(w, px1); x++) {
          total++;
          colored += sat[y * w + x];
        }
      }
      cells.push(total > 0 && colored / total > 0.5 ? 0 : 1);
    }
  }
  return cells;
}



</script>
<script>
const RAW = TPL;
// utils/matcher.js
// 把截图上已揭开的格子与 164 张模板逐格比对，返回候选排名。



const CELL = 32;          // 每格 32x32
const CELL_BYTES = 128;   // 32 行 x 4 字节
const ROW_BYTES = 12;     // 96 位 = 12 字节
const TOTAL = 1024;

const POP = new Uint8Array(256);
for (let i = 0; i < 256; i++) POP[i] = (i & 1) + POP[i >> 1];

function b64ToBytes(b64) {
  if (typeof wx !== 'undefined' && wx.base64ToArrayBuffer) {
    return new Uint8Array(wx.base64ToArrayBuffer(b64));
  }
  let bin;
  if (typeof atob === 'function') {
    bin = atob(b64);
  } else {
    bin = Buffer.from(b64, 'base64').toString('binary');
  }
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

let compiled = null;

function buildIndex() {
  if (compiled) return compiled;
  compiled = RAW.map((t) => ({
    tpl: t,
    cells: new Array(9),
  }));
  for (let i = 0; i < compiled.length; i++) {
    const bytes = b64ToBytes(RAW[i].bmp);
    for (let g = 0; g < 9; g++) {
      const r = (g / 3) | 0;
      const c = g % 3;
      const cell = new Uint8Array(CELL_BYTES);
      for (let k = 0; k < CELL; k++) {
        const src = (r * CELL + k) * ROW_BYTES + c * 4;
        cell.set(bytes.subarray(src, src + 4), k * 4);
      }
      compiled[i].cells[g] = cell;
    }
  }
  return compiled;
}

// 一致率：1024 位里有多少位相同
function agreement(a, b) {
  let diff = 0;
  for (let i = 0; i < CELL_BYTES; i++) diff += POP[a[i] ^ b[i]];
  return (TOTAL - diff) / TOTAL;
}

/**
 * @param {Uint8Array[]} observed 已揭开格子的 32x32 位图（128 字节/格），下标 0-8
 * @param {boolean[]} revealed 9 个格子是否已揭开
 * @param {number} topN
 */
function match(observed, revealed, topN = 5) {
  const list = buildIndex();
  const idx = [];
  for (let g = 0; g < 9; g++) if (revealed[g] && observed[g]) idx.push(g);
  if (!idx.length) return [];

  const scored = [];
  for (let i = 0; i < list.length; i++) {
    let sum = 0;
    for (let k = 0; k < idx.length; k++) {
      sum += agreement(observed[idx[k]], list[i].cells[idx[k]]);
    }
    scored.push({ item: list[i].tpl, score: sum / idx.length });
  }
  scored.sort((a, b) => b.score - a.score);

  const top = scored.slice(0, topN).map((s) => ({
    id: s.item.id,
    name: s.item.name,
    part: s.item.part,
    partName: s.item.partName,
    thumb: s.item.thumb,
    score: s.score,
    percent: Math.round(Math.max(0, Math.min(1, s.score)) * 1000) / 10,
  }));
  return top;
}



</script>
<script>
// 桌面版页面逻辑。框一律以原图像素为准，显示坐标只在绘制时换算。
let img = null;
let imgW = 0;
let imgH = 0;
let dispScale = 1;
let boxImg = null;
let cells = [0, 0, 0, 0, 0, 0, 0, 0, 0];
let st = null;
let anaScale = 1;

const $ = (id) => document.getElementById(id);
const stage = $('stageInner');
const shot = $('shot');
const boxEl = $('box');

function log(s) {
  $('status').textContent = s;
}

function useImage(im, url) {
  img = im;
  imgW = im.naturalWidth;
  imgH = im.naturalHeight;
  const avail = Math.min(stage.parentElement.clientWidth || 1100, window.innerWidth - 80);
  const scale = Math.min(1, avail / imgW);
  shot.style.width = Math.round(imgW * scale) + 'px';
  shot.src = url;
  dispScale = scale;
  boxImg = null;
  $('drop').style.display = 'none';
  $('stage').style.display = 'block';
  $('results').innerHTML = '';
  analyze();
}

function loadFile(file) {
  // 本地文件直接当 src 会污染画布，读成 data URL 再画
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => useImage(im, reader.result);
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}

window.loadUrl = (u) => {
  const im = new Image();
  im.onload = () => useImage(im, u);
  im.src = u;
};

function analyze() {
  try {
    const scale = Math.min(1, 1400 / Math.max(imgW, imgH));
    const aw = Math.max(1, Math.round(imgW * scale));
    const ah = Math.max(1, Math.round(imgH * scale));
    const c = document.createElement('canvas');
    c.width = aw;
    c.height = ah;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, aw, ah);
    const data = ctx.getImageData(0, 0, aw, ah).data;
    st = prepare(data, aw, ah);
    anaScale = scale;
    const found = detect(st);
    setBox({ x: found.x / scale, y: found.y / scale, size: found.size / scale }, found.confidence > 0);
  } catch (err) {
    log('出错：' + err.message);
    console.error(err);
  }
}

function setBox(f, autoFound) {
  boxImg = f;
  cells = classify(st, {
    x: f.x * anaScale,
    y: f.y * anaScale,
    size: f.size * anaScale,
  });
  const rev = cells.reduce((a, c) => a + c, 0);
  drawBox();
  log((autoFound ? '已定位九宫格' : '手动位置') + '，已揭开 ' + rev + ' 格');
  $('go').disabled = rev === 0;
}

function drawBox() {
  if (!boxImg) {
    boxEl.style.display = 'none';
    return;
  }
  const dw = Math.round(boxImg.size * dispScale);
  boxEl.style.display = 'block';
  boxEl.style.left = Math.round(boxImg.x * dispScale) + 'px';
  boxEl.style.top = Math.round(boxImg.y * dispScale) + 'px';
  boxEl.style.width = dw + 'px';
  boxEl.style.height = dw + 'px';
  const cs = dw / 3;
  boxEl.querySelectorAll('.cell').forEach((el, i) => {
    el.style.left = (i % 3) * cs + 'px';
    el.style.top = Math.floor(i / 3) * cs + 'px';
    el.style.width = cs + 'px';
    el.style.height = cs + 'px';
    el.classList.toggle('on', !!cells[i]);
  });
}

function clampBox(f) {
  const s = Math.min(Math.max(60, f.size), Math.min(imgW, imgH) * 0.98);
  return {
    x: Math.min(Math.max(0, f.x), Math.max(0, imgW - s)),
    y: Math.min(Math.max(0, f.y), Math.max(0, imgH - s)),
    size: s,
  };
}

let dragging = null;
stage.addEventListener('mousedown', (e) => {
  if (!boxImg) return;
  dragging = { x: e.clientX, y: e.clientY, bx: boxImg.x, by: boxImg.y };
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!dragging || !boxImg) return;
  boxImg = clampBox({
    x: dragging.bx + (e.clientX - dragging.x) / dispScale,
    y: dragging.by + (e.clientY - dragging.y) / dispScale,
    size: boxImg.size,
  });
  drawBox();
});
window.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = null;
  setBox(boxImg, false);
});
stage.addEventListener(
  'wheel',
  (e) => {
    // 只有按住 Ctrl 才缩放，避免普通滚动页面时误改框大小
    if (!boxImg || !e.ctrlKey) return;
    e.preventDefault();
    const factor = e.deltaY > 0 ? 1.04 : 0.96;
    const cx = boxImg.x + boxImg.size / 2;
    const cy = boxImg.y + boxImg.size / 2;
    const size = boxImg.size * factor;
    setBox(clampBox({ x: cx - size / 2, y: cy - size / 2, size }), false);
  },
  { passive: false }
);

window.addEventListener('keydown', (e) => {
  if (!boxImg) return;
  const s = (e.shiftKey ? 1 : 4) / dispScale;
  let f = null;
  if (e.key === 'ArrowLeft') f = { x: boxImg.x - s, y: boxImg.y, size: boxImg.size };
  if (e.key === 'ArrowRight') f = { x: boxImg.x + s, y: boxImg.y, size: boxImg.size };
  if (e.key === 'ArrowUp') f = { x: boxImg.x, y: boxImg.y - s, size: boxImg.size };
  if (e.key === 'ArrowDown') f = { x: boxImg.x, y: boxImg.y + s, size: boxImg.size };
  if (e.key === '+' || e.key === '=') {
    const size = boxImg.size * 0.98;
    f = { x: boxImg.x + (boxImg.size - size) / 2, y: boxImg.y + (boxImg.size - size) / 2, size };
  }
  if (e.key === '-' || e.key === '_') {
    const size = boxImg.size * 1.02;
    f = { x: boxImg.x + (boxImg.size - size) / 2, y: boxImg.y + (boxImg.size - size) / 2, size };
  }
  if (f) setBox(clampBox(f), false);
});

function sampleCells() {
  const x0 = boxImg.x;
  const y0 = boxImg.y;
  const size = boxImg.size;
  const cell = size / 3;
  const inset = cell * 0.02;
  const S = 96;
  const c = document.createElement('canvas');
  c.width = S;
  c.height = S;
  const ctx = c.getContext('2d');
  const out = [];
  for (let g = 0; g < 9; g++) {
    const r = Math.floor(g / 3);
    const cc = g % 3;
    ctx.clearRect(0, 0, S, S);
    ctx.drawImage(img, x0 + cc * cell + inset, y0 + r * cell + inset, cell - inset * 2, cell - inset * 2, 0, 0, S, S);
    const d = ctx.getImageData(0, 0, S, S).data;
    const lum = new Float32Array(32 * 32);
    for (let by = 0; by < 32; by++) {
      for (let bx = 0; bx < 32; bx++) {
        let sum = 0;
        for (let dy = 0; dy < 3; dy++) {
          for (let dx = 0; dx < 3; dx++) {
            const p = ((by * 3 + dy) * S + (bx * 3 + dx)) * 4;
            sum += (d[p] * 299 + d[p + 1] * 587 + d[p + 2] * 114) / 1000;
          }
        }
        lum[by * 32 + bx] = sum / 9;
      }
    }
    const bytes = new Uint8Array(128);
    for (let k = 0; k < 32; k++) {
      for (let j = 0; j < 32; j++) {
        if (lum[k * 32 + j] < 128) bytes[k * 4 + (j >> 3)] |= 1 << (7 - (j & 7));
      }
    }
    out.push(bytes);
  }
  return out;
}

$('go').addEventListener('click', () => {
  const t0 = performance.now();
  const top = match(sampleCells(), cells, 5);
  const ms = Math.round(performance.now() - t0);
  const rows = top
    .map(
      (r, i) => `
    <div class="row ${i === 0 ? 'first' : ''}">
      <span class="rank">${i + 1}</span>
      <img class="thumb" src="${r.thumb}">
      <div class="meta">
        <div class="name">${r.name}</div>
        <div class="sub">${r.partName} · 一致率 ${r.percent}%</div>
      </div>
    </div>`
    )
    .join('');
  $('results').innerHTML = rows + `<div class="hint">匹配耗时 ${ms} 毫秒。只揭开一两格时结果可能不准，多揭几格更稳。</div>`;
  log('识别完成');
});

$('file').addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
});

['dragenter', 'dragover'].forEach((t) =>
  document.addEventListener(t, (e) => {
    e.preventDefault();
    document.body.classList.add('dragging');
  })
);
['dragleave', 'drop'].forEach((t) =>
  document.addEventListener(t, (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
  })
);
document.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type.indexOf('image') === 0) {
      loadFile(it.getAsFile());
      break;
    }
  }
});

window.addEventListener('load', () => {
  const m = location.search.match(/[?&]img=([^&]+)/);
  if (m) window.loadUrl(decodeURIComponent(m[1]));
});

</script>
